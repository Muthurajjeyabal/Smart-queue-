:root {
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html {
  scroll-behavior: smooth;
}

body {
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

/* Custom scrollbar */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: #94a3b8;
  border-radius: 999px;
}
.dark ::-webkit-scrollbar-thumb {
  background: #475569;
}

/* Token number display */
.token-display {
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
}

/* Live indicator */
.live-dot {
  position: relative;
}
.live-dot::before {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 999px;
  background: currentColor;
  opacity: 0.35;
  animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
}

@keyframes ping {
  75%, 100% {
    transform: scale(1.8);
    opacity: 0;
  }
}

/* Card hover lift */
.card-interactive {
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
.card-interactive:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 24px -8px rgba(15, 23, 42, 0.12);
}
.card-interactive:active {
  transform: scale(0.98) translateY(0);
  transition-duration: 0.1s;
}

/* Buttons — universal smooth press feedback */
button {
  transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, opacity 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
}
button:active:not(:disabled) {
  transform: scale(0.96);
}

/* Status badges */
.badge {
  @apply inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold tracking-wide;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Smooth page transitions */
.view-enter {
  animation: view-fade-slide 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
}
@keyframes view-fade-slide {
  from { opacity: 0; transform: translateY(10px) scale(0.99); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.animate-slide-up {
  animation: slide-up-premium 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
}
@keyframes slide-up-premium {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Number countdown */
.countdown-digit {
  font-variant-numeric: tabular-nums;
  min-width: 1.15em;
  display: inline-block;
  text-align: center;
}
.token-display {
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* Glass effect */
.glass {
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
.dark .glass {
  background: rgba(15, 23, 42, 0.75);
}

/* Shimmer loading skeleton */
.skeleton {
  background: linear-gradient(90deg, rgba(148,163,184,0.15) 25%, rgba(148,163,184,0.28) 37%, rgba(148,163,184,0.15) 63%);
  background-size: 400% 100%;
  animation: shimmer 1.4s ease infinite;
  border-radius: 0.75rem;
}
.dark .skeleton {
  background: linear-gradient(90deg, rgba(51,65,85,0.4) 25%, rgba(71,85,105,0.55) 37%, rgba(51,65,85,0.4) 63%);
  background-size: 400% 100%;
}
@keyframes shimmer {
  0% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Smooth shadow system */
.shadow-card {
  box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 4px 16px -4px rgba(15,23,42,0.06);

.shadow-soft {

/* Toast entrance */
#toast-container > * {
  animation: toast-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
@keyframes toast-in {
  from { opacity: 0; transform: translateX(24px) scale(0.95); }
  to { opacity: 1; transform: translateX(0) scale(1); }

/* Modal entrance */
[id$="-modal-overlay"] {
  animation: overlay-fade 0.25s ease both;
}
@keyframes overlay-fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* Tab underline / active state smoothness */
[data-tab], [data-role] {
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);

/* Progress bars smooth fill */
.h-2.rounded-full > div, .h-1\.5.rounded-full > div {
  transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);

/* Progress ring */
.progress-ring {

/* Hide number input arrows */
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button {

/* Inputs — smooth focus */
input, select, textarea {
  transition: box-shadow 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease, transform 0.15s ease;

input:focus, select:focus, textarea:focus {

/* Focus rings */
button:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 2px solid #14b8a6;
  outline-offset: 2px;
}

/* Mobile bottom nav safe area */
.bottom-nav {

/**
 * Smart Hospital Queue — Utilities
 * Modular helpers for dates, formatting, IDs, etc.
 */

function uid(prefix = '') {
  return `${prefix}${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
}

function formatTime(date) {
  if (!(date instanceof Date)) date = new Date(date);
  return date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
}

function formatDate(date) {
  if (!(date instanceof Date)) date = new Date(date);
  return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

function formatDateTime(date) {
  return `${formatDate(date)} · ${formatTime(date)}`;
}

function addMinutes(date, minutes) {
  const d = new Date(date);
  d.setMinutes(d.getMinutes() + minutes);
  return d;
}

function minutesBetween(a, b) {
  return Math.round((new Date(b) - new Date(a)) / 60000);
}

function clamp(n, min, max) {
  return Math.min(Math.max(n, min), max);
}

function plural(n, one, many = one + 's') {
  return n === 1 ? one : many;
}

function phoneMask(phone) {
  const p = String(phone).replace(/\D/g, '');
  if (p.length === 10) return `+91 ${p.slice(0, 5)} ${p.slice(5)}`;
  return phone;
}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function parseTimeToDate(timeStr) {
  // "11:25 AM" → Date today
  const [time, period] = timeStr.split(' ');
  let [h, m] = time.split(':').map(Number);
  if (period === 'PM' && h !== 12) h += 12;
  if (period === 'AM' && h === 12) h = 0;
  const d = new Date();
  d.setHours(h, m, 0, 0);
  return d;
}

function debounce(fn, ms = 250) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), ms);
  };
}

function requestNotificationPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function showBrowserNotification(title, body, tag) {
  if ('Notification' in window && Notification.permission === 'granted') {
    try {
      new Notification(title, {
        body,
        tag,
        icon: '/assets/icon-192.png',
        badge: '/assets/icon-192.png',
      });
    } catch (_) {}
  }
}

function vibrate(pattern = [80, 40, 80]) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}

function copyToClipboard(text) {
  return navigator.clipboard?.writeText(text);
}

/** Simple event bus for cross-module communication */
const bus = {
  _handlers: {},
  on(event, fn) {
    (this._handlers[event] ||= []).push(fn);
    return () => this.off(event, fn);
  },
  off(event, fn) {
    this._handlers[event] = (this._handlers[event] || []).filter(h => h !== fn);
  },
  emit(event, payload) {
    (this._handlers[event] || []).forEach(fn => {
      try { fn(payload); } catch (e) { console.error(e); }
    });
  },
};

function getLang() {
  return localStorage.getItem('shq_patient_lang') || 'en';
}
function setLang(code) {
  localStorage.setItem('shq_patient_lang', code);
}
function t(key) {
  const lang = getLang();
  return (TRANSLATIONS[lang] && TRANSLATIONS[lang][key]) || TRANSLATIONS.en[key] || key;
}

function createInitialState() {
  return {
    version: 1,
    day: todayKey(),
    // Multi-hospital: resolved after hospital code entry
    hospitalId: null,
    hospitalCode: null,
    hospitalName: null,
    // Multiple doctors per hospital — each has its own queue, status, token counter
    doctors: [], // array of { id, name, specialty, avgConsultMin, active, status, currentPatientId, consultStartedAt, totalSeenToday, pauseReason, doctorStatusId, nextToken }
    receptionStaff: [], // array of { id, name, active }
    // All patients for today (and history)
    patients: [],
    // Appointment requests from the Patient app, awaiting Reception approval
    appointments: [],
    // Active queue order (patient ids in sequence, across all doctors — reception overview)
    queue: [], // array of patient ids that are waiting or consulting
    // Notifications log (for patient history of alerts)
    notifications: [],
    // Auth sessions (simulated)
    sessions: {
      patient: null, // { phone, patientId }
      reception: null, // { name }
      doctor: null, // { doctorId }
      manager: null, // { name }
    },
    // Settings
    settings: {
      notifyAt: [30, 15, 10], // minutes before
      recommendArriveEarlyMin: 15,
      emergencyPriorityBoost: true,
    },
  };
}

class Store {
  constructor() {
    this.state = createInitialState();
    this._subscribers = new Set();
    this._channel = null;
    this.ready = false;
  }

  subscribe(fn) {
    this._subscribers.add(fn);
    return () => this._subscribers.delete(fn);
  }

  notify() {
    this._subscribers.forEach(fn => {
      try { fn(this.state); } catch (e) { console.error(e); }
    });
    bus.emit('store:update', this.state);
  }

  getState() {
    return this.state;
  }

  // ---------- Hospital resolution (multi-tenant) ----------
  async initHospitalByCode(code) {
    const clean = String(code).trim().toLowerCase();
    if (!clean) return { ok: false, error: 'Enter a hospital code' };
    try {
      const { data: hospital, error } = await sb
        .from('hospitals')
        .select('id,name,code,address,phone,owner_id,created_at,logo_url')
        .eq('code', clean)
        .maybeSingle();
      if (error || !hospital) {
        const suggestions = await this.suggestHospitalCodes(clean);
        return { ok: false, error: 'Hospital code not found', suggestions };
      }
      await this._loadHospital(hospital);
      localStorage.setItem('shq_hospital_id', hospital.id);
      localStorage.setItem('shq_hospital_code', hospital.code);
      this._rememberCode(hospital.code);
      return { ok: true, hospital };
    } catch (e) {
      console.error(e);
      return { ok: false, error: 'Connection error: ' + (e.message || e) };
    }
  }

  async suggestHospitalCodes(partial) {
    if (!partial || partial.length < 2) return [];
    try {
      const { data } = await sb.from('hospitals').select('code, name').ilike('code', `%${partial}%`).limit(3);
      return data || [];
    } catch (e) {
      return [];
    }
  }

  _rememberCode(code) {
    try {
      let recent = JSON.parse(localStorage.getItem('shq_recent_codes') || '[]');
      recent = [code, ...recent.filter(c => c !== code)].slice(0, 3);
      localStorage.setItem('shq_recent_codes', JSON.stringify(recent));
    } catch (e) {}
  }

  getRecentCodes() {
    try {
      return JSON.parse(localStorage.getItem('shq_recent_codes') || '[]');
    } catch (e) {
      return [];
    }
  }

  async initHospitalById(id) {
    try {
      const { data: hospital, error } = await sb
        .from('hospitals')
        .select('id,name,code,address,phone,owner_id,created_at,logo_url')
        .eq('id', id)
        .maybeSingle();
      if (error || !hospital) return { ok: false, error: 'Hospital not found' };
      await this._loadHospital(hospital);
      return { ok: true, hospital };
    } catch (e) {

  async _loadHospital(hospital) {
    this.state.hospitalId = hospital.id;
    this.state.hospitalCode = hospital.code;
    this.state.hospitalName = hospital.name;
    this.state.hospitalPhone = hospital.phone || '';
    this.state.hospitalAddress = hospital.address || '';
    this.state.hospitalLogo = hospital.logo_url || '';

    const today = todayKey();

    // Load all doctors for this hospital (Reception adds them via "Add Doctor" —
    // a fresh hospital simply starts with zero doctors, no placeholder created)
    let { data: staffRows } = await sb
      .from('staff')
      .select('id,hospital_id,role,name,specialty,avg_consult_min,active,created_at')
      .eq('hospital_id', hospital.id)
      .eq('role', 'doctor')
      .order('created_at', { ascending: true });

    staffRows = staffRows || [];

    const doctorStatusRows = await Promise.all(staffRows.map(async (staffRow) => {
      let { data: statusRow } = await sb
        .from('doctor_status')
        .select('*')
        .eq('staff_id', staffRow.id)
        .eq('day', today)
        .maybeSingle();
      if (!statusRow) {
        const { data: inserted } = await sb
          .from('doctor_status')
          .insert({
            hospital_id: hospital.id,
            staff_id: staffRow.id,
            day: today,
            status: 'available',
            next_token: 1,
          })
          .select()
          .single();
        statusRow = inserted;
      }
      return statusRow;
    }));

    this.state.doctors = staffRows.map((staffRow, i) => {
      const statusRow = doctorStatusRows[i] || {};
      return {
        id: staffRow.id,
        name: staffRow.name,
        specialty: staffRow.specialty || 'General Physician',
        avgConsultMin: staffRow.avg_consult_min || DEFAULT_AVG_CONSULT,
        doctorStatusId: statusRow.id,
        status: statusRow.status || 'available',
        currentPatientId: statusRow.current_patient_id || null,
        consultStartedAt: statusRow.consult_started_at || null,
        totalSeenToday: statusRow.total_seen_today || 0,
        pauseReason: statusRow.pause_reason || null,
        nextToken: statusRow.next_token || 1,
        active: staffRow.active !== false,
      };
    });

    // Load reception staff for this hospital
    const { data: receptionRows } = await sb
      .from('staff')
      .select('id,name,active')
      .eq('hospital_id', hospital.id)
      .eq('role', 'reception')
      .order('created_at', { ascending: true });
    this.state.receptionStaff = (receptionRows || []).map(r => ({ id: r.id, name: r.name, active: r.active !== false }));

    this.state.day = today;

    // Load today's patients
    const { data: patientRows } = await sb
      .from('patients')
      .select('*')
      .eq('hospital_id', hospital.id)
      .eq('day', today)
      .order('created_at', { ascending: true });

    this.state.patients = (patientRows || []).map(mapPatientRow);

    // Load appointment requests (pending + recent resolved, so patients can see status)
    const { data: apptRows } = await sb
      .from('appointments')
      .select('*')
      .eq('hospital_id', hospital.id)
      .order('created_at', { ascending: false })
      .limit(200);
    this.state.appointments = (apptRows || []).map(mapAppointmentRow);

    // Reconcile each doctor's next token with actual max token issued (safety net)
    this.state.doctors.forEach(doc => {
      const maxToken = this.state.patients
        .filter(p => p.doctorId === doc.id)
        .reduce((m, p) => Math.max(m, p.token), 0);
      doc.nextToken = Math.max(doc.nextToken, maxToken + 1);
    });

    this._recomputeQueue();

    this._subscribeRealtime();
    this.ready = true;
    this.notify();
  }

  _subscribeRealtime() {
    if (this._channel) sb.removeChannel(this._channel);
    this._channel = sb
      .channel('hospital-' + this.state.hospitalId)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'patients', filter: `hospital_id=eq.${this.state.hospitalId}` },
        (payload) => this._handlePatientChange(payload))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'doctor_status', filter: `hospital_id=eq.${this.state.hospitalId}` },
        (payload) => this._handleDoctorStatusChange(payload))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'appointments', filter: `hospital_id=eq.${this.state.hospitalId}` },
        (payload) => this._handleAppointmentChange(payload))
      .subscribe();
  }

  _handleAppointmentChange(payload) {
    if (payload.eventType === 'DELETE') {
      this.state.appointments = this.state.appointments.filter(a => a.id !== payload.old.id);
    } else {
      const a = mapAppointmentRow(payload.new);
      const idx = this.state.appointments.findIndex(x => x.id === a.id);
      const isNew = idx < 0;
      if (idx >= 0) this.state.appointments[idx] = a; else this.state.appointments.unshift(a);
      if (isNew && a.status === 'pending') {
        bus.emit('appointment:new', a);
      }
    }
    this.notify();
  }

  _handlePatientChange(payload) {
    if (payload.eventType === 'DELETE') {
      this.state.patients = this.state.patients.filter(p => p.id !== payload.old.id);
    } else {
      const p = mapPatientRow(payload.new);
      if (p.day !== this.state.day) return;
      const idx = this.state.patients.findIndex(x => x.id === p.id);
      const prevStatus = idx >= 0 ? this.state.patients[idx].status : null;
      if (idx >= 0) this.state.patients[idx] = p; else this.state.patients.push(p);
      if (prevStatus !== p.status) {
        bus.emit('patient:status', { patient: p, prev: prevStatus });
        if (idx < 0) bus.emit('patient:registered', p);
      }
    }
    this._recomputeQueue();
    this.notify();
  }

  _handleDoctorStatusChange(payload) {
    const r = payload.new;
    if (!r) return;
    const doc = this.state.doctors.find(d => d.doctorStatusId === r.id);
    if (!doc) return;
    const prevStatus = doc.status;
    doc.status = r.status;
    doc.currentPatientId = r.current_patient_id;
    doc.consultStartedAt = r.consult_started_at;
    doc.totalSeenToday = r.total_seen_today;
    doc.pauseReason = r.pause_reason;
    doc.nextToken = r.next_token;
    if (prevStatus !== r.status && ['paused', 'break', 'emergency_pause'].includes(r.status)) {
      bus.emit('doctor:pause', { reason: r.pause_reason, doctorId: doc.id });
    }
    if (prevStatus !== r.status && r.status === 'available' && ['paused', 'break', 'emergency_pause'].includes(prevStatus)) {
      bus.emit('doctor:resume', { doctorId: doc.id });
    }
    this.notify();
  }

  _recomputeQueue() {
    const active = this.state.patients.filter(p => p.day === this.state.day && (p.status === 'waiting' || p.status === 'consulting'));
    active.sort((a, b) => {
      if (a.status === 'consulting' && b.status !== 'consulting') return -1;
      if (b.status === 'consulting' && a.status !== 'consulting') return 1;
      if (a.isEmergency && !b.isEmergency) return -1;
      if (b.isEmergency && !a.isEmergency) return 1;
      return new Date(a.createdAt) - new Date(b.createdAt);
    });
    this.state.queue = active.map(p => p.id);
  }

  // ---------- Background sync helpers (fire-and-forget) ----------
  async _pushPatientInsert(p, attempt = 1) {
    try {
      const { error } = await sb.from('patients').insert({
        id: p.id,
        hospital_id: this.state.hospitalId,
        doctor_id: p.doctorId,
        day: p.day,
        token: p.token,
        name: p.name,
        phone: p.phone,
        status: p.status,
        is_emergency: p.isEmergency,
        is_appointment: !!p.isAppointment,
        notes: p.notes,
        registered_by: p.registeredBy || null,
        created_at: p.createdAt,
      });
      if (error) throw error;
    } catch (e) {
      console.error(e);
      if (attempt < 3) {
        setTimeout(() => this._pushPatientInsert(p, attempt + 1), attempt * 1500);
      } else {
        notifications.toast('Sync issue', p.name + "'s token (#" + p.token + ") could not be saved. Check your connection and try again.", 'error');
      }
    }
  }

  async _pushPatientUpdate(p) {

  // ---------- Auth (simulated OTP) ----------
  loginPatient(phone) {
    const clean = String(phone).replace(/\D/g, '').slice(-10);
    if (clean.length !== 10) return { ok: false, error: 'Enter valid 10-digit mobile' };

    // Find or create a patient profile for this phone
    let existing = this.state.patients.find(p => p.phone === clean && p.day === this.state.day);
    this.state.sessions.patient = { phone: clean, patientId: existing?.id || null };
    this.notify();
    return { ok: true, phone: clean };
  }

  loginReception(name = 'Reception Staff', staffId = null) {
    this.state.sessions.reception = { name, staffId };
    this.notify();
    return { ok: true };
  }

  loginManager(name = 'Manager') {
    this.state.sessions.manager = { name };
    this.notify();
    return { ok: true };

  loginDoctor(doctorId) {

    this.state.sessions.doctor = { doctorId };

  logout(role) {

    if (role === 'reception') this.state.sessions.reception = null;

  // ---------- Patient registration & tokens ----------
  registerWalkIn({ name, phone, isEmergency = false, notes = '', doctorId, isAppointment = false, registeredBy = '' }) {
    const doc = this.getDoctor(doctorId);
    if (!doc) throw new Error('A doctor must be selected to register a patient');
    const cleanPhone = String(phone).replace(/\D/g, '').slice(-10);
    const token = doc.nextToken++;
    const patient = {
      id: (crypto.randomUUID ? crypto.randomUUID() : uid('pt-')),
      day: this.state.day,
      name: name.trim(),
      phone: cleanPhone,
      token,
      status: 'waiting',
      isEmergency: !!isEmergency,
      isAppointment: !!isAppointment,
      notes,
      registeredBy,
      createdAt: new Date().toISOString(),
      consultStartedAt: null,
      consultEndedAt: null,
      doctorId: doc.id,
    };
    this.state.patients.push(patient);
    this._recomputeQueue();

    this.notify();
    bus.emit('patient:registered', patient);
    this._pushPatientInsert(patient);
    this._pushDoctorStatus(doc.id); // persists updated next_token
    return patient;
  }

  // ---------- Appointment requests (Patient → Reception approval) ----------
  async requestAppointment({ name, phone, age, gender, doctorId, preferredDate, preferredTime, notes }) {
    const doc = this.getDoctor(doctorId);
    if (!doc) return { ok: false, error: 'Please choose a doctor' };
    const cleanPhone = String(phone).replace(/\D/g, '').slice(-10);
    if (cleanPhone.length !== 10) return { ok: false, error: 'Enter a valid 10-digit mobile number' };
    if (!name || !name.trim()) return { ok: false, error: 'Enter the patient name' };

    try {
      const { data, error } = await sb.from('appointments').insert({
        hospital_id: this.state.hospitalId,
        doctor_id: doctorId,
        patient_name: name.trim(),
        patient_phone: cleanPhone,
        age: age ? Number(age) : null,
        gender: gender || null,
        preferred_date: preferredDate || null,
        preferred_time: preferredTime || null,
        notes: notes || '',
        status: 'pending',
      }).select().single();
      if (error || !data) throw error || new Error('Insert failed');
      const appt = mapAppointmentRow(data);
      this.state.appointments.unshift(appt);
      this.notify();
      return { ok: true, appointment: appt };
    } catch (e) {
      console.error(e);
      return { ok: false, error: 'Could not send request. Check your connection.' };
    }
  }

  getAppointmentsForPhone(phone) {
    const clean = String(phone).replace(/\D/g, '').slice(-10);
    return this.state.appointments
      .filter(a => a.phone === clean)

  async approveAppointment(appointmentId) {
    const appt = this.state.appointments.find(a => a.id === appointmentId);
    if (!appt) return { ok: false, error: 'Request not found' };
    try {
      const patient = this.registerWalkIn({
        name: appt.name,
        phone: appt.phone,
        isEmergency: false,
        isAppointment: true,
        notes: [appt.preferredDate, appt.preferredTime].filter(Boolean).join(' '),
        doctorId: appt.doctorId,
      });
      await sb.from('appointments').update({
        status: 'approved',
        resolved_patient_id: patient.id,
        resolved_at: new Date().toISOString(),
      }).eq('id', appointmentId);
      appt.status = 'approved';
      appt.resolvedPatientId = patient.id;

  getAllPatientsByPhone(phone) {

  // ---------- Queue operations (Reception & Doctor) ----------
  setPatientStatus(patientId, status) {
    const p = this.getPatient(patientId);
    if (!p) return false;
    const doc = this.getDoctor(p.doctorId);
    const prev = p.status;
    p.status = status;
    let avgChanged = false;

    if (status === 'consulting' && doc) {
      p.consultStartedAt = new Date().toISOString();
      doc.status = 'consulting';
      doc.currentPatientId = patientId;
      doc.consultStartedAt = p.consultStartedAt;
    }

    if (status === 'completed' && doc) {
      p.consultEndedAt = new Date().toISOString();
      doc.totalSeenToday += 1;
      // Update running average (simple EMA)
      if (p.consultStartedAt) {
        const duration = Math.max(3, Math.round((new Date(p.consultEndedAt) - new Date(p.consultStartedAt)) / 60000));
        const alpha = 0.3;
        doc.avgConsultMin = Math.round(
          alpha * duration + (1 - alpha) * doc.avgConsultMin
        );
        avgChanged = true;
      }
      doc.currentPatientId = null;
      doc.consultStartedAt = null;
      if (doc.status === 'consulting') {
        doc.status = 'available';
      }
    }

    if ((status === 'no_show' || status === 'cancelled') && doc) {
      if (doc.currentPatientId === patientId) {
        doc.currentPatientId = null;
        doc.consultStartedAt = null;
        doc.status = 'available';
      }
    }

    this._recomputeQueue();
    this.notify();
    bus.emit('patient:status', { patient: p, prev });
    this._pushPatientUpdate(p);
    if (doc) {
      this._pushDoctorStatus(doc.id);
      if (avgChanged) this._pushStaffAvg(doc.id);
    }
    return true;
  }

  // ---------- Doctor controls ----------
  doctorStartConsultation(doctorId) {
    // Start the first waiting patient for this doctor
    const nextId = this.state.queue.find(id => {
      const p = this.getPatient(id);
      return p && p.status === 'waiting' && p.doctorId === doctorId;
    });
    if (!nextId) return { ok: false, error: 'No patients waiting' };
    this.setPatientStatus(nextId, 'consulting');
    return { ok: true, patient: this.getPatient(nextId) };
  }

  doctorNextPatient(doctorId) {
    // Complete current if consulting, then start next
    const doc = this.getDoctor(doctorId);
    if (doc && doc.currentPatientId) {
      this.setPatientStatus(doc.currentPatientId, 'completed');
    }
    return this.doctorStartConsultation(doctorId);
  }

  doctorPause(doctorId, reason = 'paused') {
    const doc = this.getDoctor(doctorId);
    if (!doc) return;
    doc.status = reason === 'break' ? 'break' : reason === 'emergency' ? 'emergency_pause' : 'paused';
    doc.pauseReason = reason;
    this.notify();
    bus.emit('doctor:pause', { reason, doctorId });
    this._pushDoctorStatus(doctorId);
  }

  doctorResume(doctorId) {
    const doc = this.getDoctor(doctorId);
    if (!doc) return;
    doc.status = doc.currentPatientId ? 'consulting' : 'available';
    doc.pauseReason = null;
    this.notify();
    bus.emit('doctor:resume', { doctorId });
    this._pushDoctorStatus(doctorId);
  }

  doctorFinishDay(doctorId) {
    const doc = this.getDoctor(doctorId);
    if (!doc) return;
    doc.status = 'finished';
    // Mark this doctor's remaining waiting patients as cancelled for the day
    const toCancel = [];
    this.state.patients.forEach(p => {
      if (p.doctorId === doctorId && p.day === this.state.day && p.status === 'waiting') {
        p.status = 'cancelled';
        toCancel.push(p);
      }
    });
    doc.currentPatientId = null;
    this._recomputeQueue();
    this.notify();
    this._pushDoctorStatus(doctorId);
    toCancel.forEach(p => this._pushPatientUpdate(p));
  }

  // ---------- Derived helpers ----------
  getActiveQueue(doctorId) {
    const list = this.state.queue
      .map(id => this.getPatient(id))
      .filter(Boolean)
      .filter(p => p.status === 'waiting' || p.status === 'consulting');
    return doctorId ? list.filter(p => p.doctorId === doctorId) : list;
  }

  getWaitingPatients(doctorId) {
    return this.getActiveQueue(doctorId).filter(p => p.status === 'waiting');
  }

  getCurrentPatient(doctorId) {
    const doc = this.getDoctor(doctorId);
    if (!doc || !doc.currentPatientId) return null;
    return this.getPatient(doc.currentPatientId);
  }

  searchPatients(query) {
    const q = String(query).toLowerCase().trim();
    if (!q) return this.state.patients.filter(p => p.day === this.state.day);
    return this.state.patients.filter(p =>
      p.day === this.state.day &&
      (p.name.toLowerCase().includes(q) ||
        p.phone.includes(q) ||
        String(p.token).includes(q))
    );
  }

  getHistoryForPhone(phone) {
    const clean = String(phone).replace(/\D/g, '').slice(-10);
    return this.state.patients
      .filter(p => p.phone === clean)
      .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  }

  // ---------- Reports (Manager) ----------
  // Searches ALL patient records for this hospital ever recorded — not limited to any date range
  async searchPatientHistory(query) {
    const q = query.trim();
    if (!q) return { ok: true, results: [] };
    try {
      const digitsOnly = q.replace(/\D/g, '');
      const isPhoneLike = digitsOnly.length >= 3 && digitsOnly.length === q.replace(/\s/g, '').length;
      const col = isPhoneLike ? 'phone' : 'name';
      const term = isPhoneLike ? digitsOnly : q;

      const { data, error } = await sb
        .from('patients')
        .select('id, day, status, doctor_id, is_emergency, created_at, name, phone, token')
        .eq('hospital_id', this.state.hospitalId)
        .ilike(col, `%${term}%`)
        .order('created_at', { ascending: false })
        .limit(100);

      if (error) throw error;
      return { ok: true, results: data || [] };
    } catch (e) {
      console.error(e);
      return { ok: false, error: 'Search failed' };
    }
  }

  async getReportData({ days = 30, fromDate = null, toDate = null } = {}) {
    try {
      let sinceStr, untilStr;
      if (fromDate) {
        sinceStr = fromDate;
        untilStr = toDate || fromDate;
      } else {
        const since = new Date();
        since.setDate(since.getDate() - (days - 1));
        sinceStr = since.toISOString().slice(0, 10);
        untilStr = todayKey();
      }

      const [{ data, error }, { data: feedbackRows, error: fbError }] = await Promise.all([
        sb.from('patients')
          .select('id, day, status, doctor_id, is_emergency, created_at, name, phone, token')
          .eq('hospital_id', this.state.hospitalId)
          .gte('day', sinceStr)
          .lte('day', untilStr)
          .order('day', { ascending: false }),
        sb.from('feedback')
          .select('rating, comment, patient_name, token, created_at')
          .eq('hospital_id', this.state.hospitalId)
          .gte('created_at', sinceStr + 'T00:00:00')
          .lte('created_at', untilStr + 'T23:59:59')
          .order('created_at', { ascending: false }),
      ]);

      if (error) throw error;
      const rows = data || [];
      const feedback = fbError ? [] : (feedbackRows || []);

      const byDay = {};
      const byDoctor = {};
      const byHour = {};
      for (let h = 0; h < 24; h++) byHour[h] = 0;
      let totalCompleted = 0, totalNoShow = 0, totalCancelled = 0, totalEmergency = 0;

      rows.forEach(r => {
        if (!byDay[r.day]) byDay[r.day] = { day: r.day, total: 0, completed: 0, noShow: 0, cancelled: 0 };
        byDay[r.day].total++;
        if (r.status === 'completed') { byDay[r.day].completed++; totalCompleted++; }
        if (r.status === 'no_show') { byDay[r.day].noShow++; totalNoShow++; }
        if (r.status === 'cancelled') { byDay[r.day].cancelled++; totalCancelled++; }
        if (r.is_emergency) totalEmergency++;

        const docId = r.doctor_id || 'unknown';
        if (!byDoctor[docId]) byDoctor[docId] = { doctorId: docId, total: 0, completed: 0 };
        byDoctor[docId].total++;
        if (r.status === 'completed') byDoctor[docId].completed++;

        if (r.created_at) {
          const hr = new Date(r.created_at).getHours();
          byHour[hr] = (byHour[hr] || 0) + 1;
        }
      });

      const peakHours = Object.entries(byHour)
        .map(([hour, count]) => ({ hour: Number(hour), count }))
        .sort((a, b) => b.count - a.count);

      const avgRating = feedback.length
        ? Math.round((feedback.reduce((sum, f) => sum + f.rating, 0) / feedback.length) * 10) / 10
        : null;
      const ratingCounts = [1, 2, 3, 4, 5].map(n => feedback.filter(f => f.rating === n).length);

      return {
        ok: true,
        days: Object.values(byDay).sort((a, b) => b.day.localeCompare(a.day)),
        doctors: Object.values(byDoctor).sort((a, b) => b.total - a.total),
        totals: {
          totalPatients: rows.length,
          totalCompleted, totalNoShow, totalCancelled, totalEmergency,
        },
        peakHours,
        feedback: { entries: feedback, avgRating, ratingCounts, count: feedback.length },
        rawRows: rows,
        range: { from: sinceStr, to: untilStr },
      };
    } catch (e) {
      console.error(e);
      return { ok: false, error: 'Could not load report data' };
    }
  }

  // Seed demo data if empty
  seedDemoIfEmpty() {
    if (this.state.patients.some(p => p.day === this.state.day)) return;
    if (!this.state.doctors.length) return;
    const names = [
      { name: 'Rahul Mehta', phone: '9876543210' },
      { name: 'Priya Nair', phone: '9876543211' },
      { name: 'Amit Patel', phone: '9876543212' },
      { name: 'Sneha Reddy', phone: '9876543213' },
      { name: 'Vikram Singh', phone: '9876543214' },
      { name: 'Anjali Gupta', phone: '9876543215' },
      { name: 'Karthik Iyer', phone: '9876543216' },
      { name: 'Meera Joshi', phone: '9876543217' },
    ];
    names.forEach((n, i) => {
      this.registerWalkIn({
        name: n.name,
        phone: n.phone,
        isEmergency: i === 2, // one emergency for demo
        doctorId: this.state.doctors[i % this.state.doctors.length].id,
      });
    });
  }

  resetAll() {
    localStorage.removeItem('shq_hospital_id');
    localStorage.removeItem('shq_hospital_code');
    if (this._channel) sb.removeChannel(this._channel);
    this.state = createInitialState();
    this.notify();
  }
}

const store = new Store();


/**
 * Smart Hospital Queue — Live Queue Engine & Smart ETA
 *
 * Calculates:
 * - Current token
 * - Patients ahead
 * - Estimated consultation start
 * - Recommended arrival time
 * - Dynamic updates on status / pause / emergency
 *
 * Architecture note: Pure functions over state → easy to move to server later
 * or replace with ML model for prediction.
 */



const ENGINE_TICK_MS = 15000; // recompute every 15s

class QueueEngine {
  constructor() {
    this._timer = null;
    this._snapshots = {}; // doctorId -> snapshot
  }

  start() {
    this.recompute();
    this._timer = setInterval(() => this.recompute(), ENGINE_TICK_MS);
    // React to store changes immediately
    store.subscribe(() => this.recompute());
  }

  stop() {
    if (this._timer) clearInterval(this._timer);
  }

  /**
   * Core ETA calculation — computed once per doctor
   */
  recompute() {
    const state = store.getState();
    const now = new Date();

    state.doctors.forEach(doctor => {
      const avg = Math.max(4, doctor.avgConsultMin || 10);
      const active = store.getActiveQueue(doctor.id);

      const isPaused = ['paused', 'break', 'emergency_pause'].includes(doctor.status);
      const isFinished = doctor.status === 'finished';

      let remainingCurrent = 0;
      if (doctor.status === 'consulting' && doctor.consultStartedAt) {
        const elapsed = Math.round((now - new Date(doctor.consultStartedAt)) / 60000);
        remainingCurrent = Math.max(1, avg - elapsed);
        remainingCurrent = Math.min(remainingCurrent, avg);
      }

      const enriched = active.map((patient, index) => {
        let patientsAhead = 0;
        let estimatedStart = null;
        let estimatedEnd = null;
        let recommendedArrival = null;
        let waitMinutes = 0;

        if (isFinished) {
          return {
            ...patient,
            patientsAhead: 0, estimatedStart: null, estimatedEnd: null,
            recommendedArrival: null, waitMinutes: 0, isCurrent: false,
          };
        }

        if (patient.status === 'consulting') {
          patientsAhead = 0;
          estimatedStart = doctor.consultStartedAt ? new Date(doctor.consultStartedAt) : now;
          estimatedEnd = addMinutes(now, remainingCurrent);
          waitMinutes = 0;
        } else {
          patientsAhead = active.slice(0, index).filter(p => p.status === 'waiting' || p.status === 'consulting').length;
          let minutesUntil = remainingCurrent;
          const waitingBefore = active.slice(0, index).filter(p => p.status === 'waiting').length;
          minutesUntil += waitingBefore * avg;
          if (isPaused) minutesUntil += 8;
          waitMinutes = Math.max(0, Math.round(minutesUntil));
          estimatedStart = addMinutes(now, waitMinutes);
          estimatedEnd = addMinutes(estimatedStart, avg);
          recommendedArrival = addMinutes(estimatedStart, -state.settings.recommendArriveEarlyMin);
        }

        if (patient.estimatedStart !== (estimatedStart ? estimatedStart.toISOString() : null)) {
          patient.estimatedStart = estimatedStart ? estimatedStart.toISOString() : null;
        }

        return {
          ...patient, patientsAhead, estimatedStart, estimatedEnd, recommendedArrival, waitMinutes,
          isCurrent: patient.status === 'consulting',
        };
      });

      const current = enriched.find(p => p.status === 'consulting') || enriched.find(p => p.status === 'waiting');
      const currentToken = current ? current.token : null;
      const upcoming = enriched.filter(p => p.status === 'waiting').slice(0, 5);

      this._snapshots[doctor.id] = {
        doctorId: doctor.id,
        doctorName: doctor.name,
        doctorSpecialty: doctor.specialty,
        currentToken,
        doctorStatus: doctor.status,
        isPaused, isFinished,
        avgConsultMin: avg,
        totalSeen: doctor.totalSeenToday,
        totalWaiting: enriched.filter(p => p.status === 'waiting').length,
        totalInQueue: enriched.length,
        queue: enriched,
        upcoming,
        updatedAt: now.toISOString(),
      };
    });

    bus.emit('queue:updated', this._snapshots);
    return this._snapshots;
  }

  getSnapshot(doctorId) {
    if (!this._snapshots[doctorId]) this.recompute();
    return this._snapshots[doctorId] || {
      doctorId: null, currentToken: null, doctorStatus: 'available', isPaused: false, isFinished: false,
      avgConsultMin: DEFAULT_AVG_CONSULT, totalSeen: 0, totalWaiting: 0, totalInQueue: 0, queue: [], upcoming: [],
    };
  }

  // Aggregate snapshot across ALL doctors — used by Reception's overview cards
  getOverview() {
    const state = store.getState();
    let totalInQueue = 0, totalWaiting = 0, totalSeen = 0, nextTokenSum = 0;
    state.doctors.forEach(doc => {
      const snap = this.getSnapshot(doc.id);
      totalInQueue += snap.totalInQueue;
      totalWaiting += snap.totalWaiting;
      totalSeen += snap.totalSeen;
      nextTokenSum += doc.nextToken;
    });
    return { totalInQueue, totalWaiting, totalSeen, doctorCount: state.doctors.length };
  }

  /**
   * Get ETA info for a specific patient (by id or token) — looks up the
   * patient's assigned doctor to find them within that doctor's queue.
   */
  getEtaForPatient(patientIdOrToken) {
    const patient = store.getPatient(patientIdOrToken) || store.getPatientByToken(patientIdOrToken);
    if (!patient) return null;
    const snap = this.getSnapshot(patient.doctorId);
    const item = snap.queue.find(p => p.id === patient.id);
    if (!item) return null;

    return {
      token: item.token,
      status: item.status,
      patientsAhead: item.patientsAhead,
      waitMinutes: item.waitMinutes,
      estimatedStart: item.estimatedStart,
      estimatedEnd: item.estimatedEnd,
      recommendedArrival: item.recommendedArrival,
      estimatedStartLabel: item.estimatedStart ? formatTime(item.estimatedStart) : '—',
      recommendedArrivalLabel: item.recommendedArrival ? formatTime(item.recommendedArrival) : '—',
      isCurrent: item.isCurrent,
      doctorStatus: snap.doctorStatus,
      avgConsultMin: snap.avgConsultMin,
    };
  }

  /**
   * Human readable delay message
   */
  getDelayMessage(doctorId) {
    const snap = this.getSnapshot(doctorId);
    if (snap.isFinished) return 'Clinic closed for today';
    if (snap.doctorStatus === 'break') return 'Doctor is on a short break';
    if (snap.doctorStatus === 'emergency_pause') return 'Emergency — queue temporarily paused';
    if (snap.doctorStatus === 'paused') return 'Doctor has paused the queue';
    if (snap.doctorStatus === 'consulting') return 'Consultation in progress';
    return 'Doctor is available';
  }
}

const queueEngine = new QueueEngine();


/**
 * Smart Hospital Queue — Notification Service
 * Handles in-app toasts + browser notifications + scheduled alerts
 * based on ETA thresholds (30 / 15 / 10 min).
 */




const SENT_KEY = 'shq_notified_';

class NotificationService {
  constructor() {
    this._sent = new Set(); // session-level + persisted keys
    this._loadSent();
    this._checkTimer = null;
  }

  _loadSent() {
    try {
      const raw = sessionStorage.getItem(SENT_KEY);
      if (raw) JSON.parse(raw).forEach(k => this._sent.add(k));
    } catch {}
  }

  _persistSent() {
    try {
      sessionStorage.setItem(SENT_KEY, JSON.stringify([...this._sent]));
    } catch {}
  }

  _mark(key) {
    this._sent.add(key);
    this._persistSent();
  }

  _has(key) {
    return this._sent.has(key);
  }

  start() {
    // Listen to queue updates and patient events
    bus.on('queue:updated', () => this._evaluateThresholds());
    bus.on('patient:registered', (p) => {
      this.toast(`Token #${p.token} issued`, `${p.name} added to queue`, 'success');
      this._notifyPatient(p, 'confirmed', `Appointment confirmed. Your token is #${p.token}`);
    });
    bus.on('patient:status', ({ patient, prev }) => {
      if (patient.status === 'consulting' && prev !== 'consulting') {
        this.toast(`Now consulting`, `Token #${patient.token} — ${patient.name}`, 'info');
        this._notifyPatient(patient, 'started', `Doctor has started consultation for token #${patient.token}`);
      }
      if (patient.status === 'completed') {
        this.toast(`Completed`, `Token #${patient.token} finished`, 'success');
        this._notifyPatient(patient, 'completed', `Consultation completed. Thank you!`);
      }
    });
    bus.on('doctor:pause', ({ reason }) => {
      const msg = reason === 'break' ? 'Doctor is on a break' :
        reason === 'emergency' ? 'Emergency pause — please wait' : 'Queue paused by doctor';
      this.toast('Queue Update', msg, 'warning');
    });
    bus.on('doctor:resume', () => {
      this.toast('Queue Resumed', 'Doctor is available again', 'success');
    });

    // Periodic threshold check (in case ETA drifts)
    this._checkTimer = setInterval(() => this._evaluateThresholds(), 20000);
  }

  stop() {
    if (this._checkTimer) clearInterval(this._checkTimer);
  }

  /** In-app toast */
  toast(title, message = '', type = 'info', duration = 4200) {
    const container = document.getElementById('toast-container');
    if (!container) return;

    const colors = {
      info: 'bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900',
      success: 'bg-teal-600 text-white',
      warning: 'bg-amber-500 text-white',
      error: 'bg-rose-600 text-white',
    };

    const el = document.createElement('div');
    el.className = `pointer-events-auto rounded-2xl shadow-lg px-4 py-3 ${colors[type] || colors.info} animate-slide-up flex gap-3 items-start`;
    el.innerHTML = `
      <div class="flex-1 min-w-0">
        <p class="font-semibold text-sm leading-tight">${escapeHtml(title)}</p>
        ${message ? `<p class="text-xs opacity-90 mt-0.5 leading-snug">${escapeHtml(message)}</p>` : ''}
      </div>
      <button class="opacity-70 hover:opacity-100 transition shrink-0" aria-label="Dismiss">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    `;
    el.querySelector('button').onclick = () => el.remove();
    container.appendChild(el);
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transform = 'translateX(12px)';
      el.style.transition = 'all 0.3s ease';
      setTimeout(() => el.remove(), 300);
    }, duration);
  }

  _notifyPatient(patient, kind, body) {
    // Only if this browser is the patient's session
    const session = store.getState().sessions.patient;
    if (!session || session.phone !== patient.phone) return;

    const title = kind === 'confirmed' ? 'Appointment Confirmed' :
      kind === 'started' ? 'Consultation Started' :
      kind === 'completed' ? 'Consultation Completed' :
      kind === '30min' ? 'Your turn in ~30 min' :
      kind === '15min' ? 'Your turn in ~15 min' :
      kind === '10min' ? 'Your turn in ~10 min' :
      kind === 'arrive' ? 'Please Arrive Now' :
      kind === 'ahead3' ? 'Almost Your Turn' :
      kind === 'next' ? 'You are Next!' : 'Queue Update';

    showBrowserNotification(title, body, `shq-${patient.id}-${kind}`);
    vibrate();
  }

  _evaluateThresholds() {
    const session = store.getState().sessions.patient;
    if (!session) return;

    const patient = store.getPatientByPhone(session.phone);
    if (!patient || patient.status !== 'waiting') return;

    const eta = queueEngine.getEtaForPatient(patient.id);
    if (!eta || eta.waitMinutes == null) return;

    const thresholds = [
      { min: 30, kind: '30min', body: `Approximately 30 minutes remaining. Estimated time ${eta.estimatedStartLabel}` },
      { min: 15, kind: '15min', body: `About 15 minutes left. Please prepare to leave for the hospital.` },
      { min: 10, kind: '10min', body: `Your turn is in ~10 minutes. Recommended arrival: ${eta.recommendedArrivalLabel}` },
      { min: 5, kind: 'arrive', body: `Please proceed to the hospital now. Your estimated time is ${eta.estimatedStartLabel}` },
      { min: 1, kind: 'next', body: `You are next! Please be ready near the consultation room.` },
    ];

    for (const t of thresholds) {
      const key = `${patient.id}-${t.kind}`;
      if (eta.waitMinutes <= t.min && !this._has(key)) {
        this._mark(key);
        this.toast(
          t.kind === 'arrive' || t.kind === 'next' ? 'Time to arrive' : `~${t.min} min remaining`,
          t.body,
          t.kind === 'arrive' || t.kind === 'next' ? 'warning' : 'info'
        );
        this._notifyPatient(patient, t.kind, t.body);
      }
    }

    // Patients-ahead based reminder (independent of time estimate)
    if (eta.patientsAhead != null) {
      const aheadKey = `${patient.id}-ahead3`;
      if (eta.patientsAhead <= 3 && eta.patientsAhead > 0 && !this._has(aheadKey)) {
        this._mark(aheadKey);
        const body = `Only ${eta.patientsAhead} patient${eta.patientsAhead === 1 ? '' : 's'} ahead of you now. Head to the hospital soon.`;
        this.toast('Almost your turn', body, 'warning');
        this._notifyPatient(patient, 'ahead3', body);
      }
    }
  }
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function icon(name, size = 20, cls = '') {

function statusBadge(status) {

  return `<span class="badge ${s.cls}">${s.label}</span>`;
}

function doctorStatusBadge(status) {
  const map = {
    available: { label: 'Available', cls: 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-200', dot: 'bg-emerald-500' },
    consulting: { label: 'Consulting', cls: 'bg-teal-100 text-teal-800 dark:bg-teal-900/40 dark:text-teal-200', dot: 'bg-teal-500' },

  // Hospital code entry
  async function attemptHospitalCode(codeValue) {
    const codeInput = root.querySelector('#hospital-code-input');
    const errBox = root.querySelector('#hospital-code-error');
    const suggBox = root.querySelector('#hospital-code-suggestions');
    const btn = root.querySelector('#btn-hospital-code');
    const label = root.querySelector('#btn-hospital-code-label');
    errBox.classList.add('hidden');
    suggBox.innerHTML = '';
    btn.disabled = true;
    label.innerHTML = `${icon('loader-2', 16, 'animate-spin')} Checking…`;
    const res = await store.initHospitalByCode(codeValue);
    btn.disabled = false;
    label.textContent = 'Continue';
    if (!res.ok) {
      errBox.classList.remove('hidden');
      if (res.suggestions && res.suggestions.length) {
        suggBox.innerHTML = `<p class="w-full text-[11px] text-slate-400 mb-1">Did you mean:</p>` +
          res.suggestions.map(s => `<button type="button" data-suggest-code="${escapeHtml(s.code)}" class="text-[11px] px-2.5 py-1 rounded-full border ${branding.chip} hover:opacity-80 transition">${escapeHtml(s.name)} (${escapeHtml(s.code)})</button>`).join('');
        suggBox.querySelectorAll('[data-suggest-code]').forEach(b => {
          b.addEventListener('click', () => {
            codeInput.value = b.dataset.suggestCode;
            attemptHospitalCode(b.dataset.suggestCode);
          });
        });
      }
      return;
    }
    notifications.toast('Connected', res.hospital.name, 'success');
    if (autoEnterRole()) return;
    renderLogin(root);
  }

  root.querySelector('#btn-hospital-code')?.addEventListener('click', () => {
    attemptHospitalCode(root.querySelector('#hospital-code-input').value);
  });
  root.querySelector('#hospital-code-input')?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') root.querySelector('#btn-hospital-code')?.click();
  });

    b.addEventListener('click', () => {
      root.querySelector('#hospital-code-input').value = b.dataset.recentCode;
      attemptHospitalCode(b.dataset.recentCode);
    });
  });

  root.querySelector('#btn-explore')?.addEventListener('click', () => {
    window.location.hash = '#/explore';
  });

  root.querySelector('[data-action="change-hospital"]')?.addEventListener('click', () => {
    store.resetAll();
    renderLogin(root);
  });

  // ---------- Staff PIN gate ----------
  function enterStaffRole(role) {
    if (role === 'reception') {
      const staff = store.getActiveReceptionStaff();
      if (staff.length === 0) {
        // No named staff set up yet — fall back to the shared hospital Reception PIN
        if (isPinUnlocked('reception')) {
          enterAsReception('Reception Staff');
        } else {
          showPinGate('reception');
        }
      } else {
        showReceptionSelectGate();
      }
    } else if (role === 'manager') {
      store.loginManager();
      notifications.toast('Welcome', 'Manager dashboard ready', 'success');
      window.location.hash = '#/manager';
    } else if (role === 'doctor') {
      const doctors = store.getActiveDoctors();
      if (doctors.length === 0) {
        notifications.toast('No doctors yet', 'Ask your manager to add a doctor first', 'warning');
      } else {
        // Always ask "who are you" + their own PIN — each doctor has an individual PIN
        showDoctorSelectGate();
      }
    }
  }

  function enterAsReception(name, staffId = null) {
    store.loginReception(name, staffId);
    notifications.toast('Welcome', name + ' — Reception desk ready', 'success');
    window.location.hash = '#/reception';
  }

  function showReceptionSelectGate() {
    root.querySelector('#role-select')?.classList.add('hidden');
    root.querySelector('#pin-gate')?.classList.add('hidden');
    const gate = root.querySelector('#doctor-select-gate');
    gate.classList.remove('hidden');
    root.querySelector('#doctor-select-title').textContent = 'Welcome';
    root.querySelector('#doctor-select-subtitle').textContent = 'Please select your name to continue.';
    const list = root.querySelector('#doctor-select-list');
    const staff = store.getActiveReceptionStaff();
    list.innerHTML = staff.map(s => `
      <button data-select-staff="${s.id}" data-select-staff-name="${escapeHtml(s.name)}" class="w-full flex items-center gap-3 p-3 rounded-xl border border-slate-200 dark:border-slate-800 hover:border-sky-400 transition text-left">
        <div class="w-10 h-10 rounded-xl bg-sky-50 dark:bg-sky-950 text-sky-600 dark:text-sky-400 flex items-center justify-center shrink-0">
          ${icon('clipboard-list', 18)}
        </div>
        <div class="min-w-0">
          <p class="font-semibold text-sm truncate">${escapeHtml(s.name)}</p>
        </div>
      </button>
    `).join('');
    list.querySelectorAll('[data-select-staff]').forEach(btn => {
      btn.addEventListener('click', () => showIndividualPinGate(btn.dataset.selectStaff, btn.dataset.selectStaffName, 'reception'));
    });
  }

  function showIndividualPinGate(staffId, name, role) {
    root.querySelector('#role-select')?.classList.add('hidden');
    root.querySelector('#doctor-select-gate')?.classList.add('hidden');
    const gate = root.querySelector('#pin-gate');
    gate.classList.remove('hidden');
    gate.dataset.mode = 'individual';
    gate.dataset.staffId = staffId;
    gate.dataset.staffName = name;
    gate.dataset.staffRole = role; // 'reception' | 'doctor' — used for fallback + where to navigate on success
    root.querySelector('#pin-gate-title').textContent = `Enter PIN — ${name}`;
    root.querySelector('#pin-input').value = '';
    root.querySelector('#pin-error').classList.add('hidden');
    root.querySelector('#pin-input')?.focus();
  }

  function enterAsDoctor(doctorId) {
    const res = store.loginDoctor(doctorId);
    if (!res.ok) {
      notifications.toast('Error', res.error, 'error');
      return;
    }
    localStorage.setItem(`shq_last_doctor_${store.getState().hospitalId}`, doctorId);
    notifications.toast('Welcome Doctor', 'Queue control panel active', 'success');
    window.location.hash = '#/doctor';
  }

  function showDoctorSelectGate() {
    root.querySelector('#role-select')?.classList.add('hidden');
    root.querySelector('#pin-gate')?.classList.add('hidden');
    root.querySelector('#doctor-select-gate')?.classList.remove('hidden');
    root.querySelector('#doctor-select-title').textContent = 'Welcome, Doctor';
    root.querySelector('#doctor-select-subtitle').textContent = 'Please select your name to continue.';
    const list = root.querySelector('#doctor-select-list');
    const doctors = store.getActiveDoctors();
    list.innerHTML = doctors.map(d => `
      <button data-select-doctor="${d.id}" data-select-doctor-name="${escapeHtml(d.name)}" class="w-full flex items-center gap-3 p-3 rounded-xl border border-slate-200 dark:border-slate-800 hover:border-violet-400 transition text-left">
        <div class="w-10 h-10 rounded-xl bg-violet-50 dark:bg-violet-950 text-violet-600 dark:text-violet-400 flex items-center justify-center shrink-0">
          ${icon('stethoscope', 18)}
        </div>
        <div class="min-w-0">
          <p class="font-semibold text-sm truncate">${escapeHtml(d.name)}</p>
          <p class="text-xs text-slate-500 truncate">${escapeHtml(d.specialty)}</p>
        </div>
      </button>
    `).join('');
    list.querySelectorAll('[data-select-doctor]').forEach(btn => {
      btn.addEventListener('click', () => showIndividualPinGate(btn.dataset.selectDoctor, btn.dataset.selectDoctorName, 'doctor'));
    });
  }

  function showPinGate(role) {
    root.querySelector('#role-select')?.classList.add('hidden');
    root.querySelector('#patient-login')?.classList.add('hidden');
    root.querySelector('#doctor-select-gate')?.classList.add('hidden');
    const gate = root.querySelector('#pin-gate');
    gate.classList.remove('hidden');
    gate.dataset.mode = 'hospital';
    gate.dataset.role = role;
    root.querySelector('#pin-gate-title').textContent = role === 'doctor' ? 'Enter Doctor PIN' : role === 'manager' ? 'Enter Manager PIN' : 'Enter Reception PIN';
    root.querySelector('#pin-input').value = '';
    root.querySelector('#pin-error').classList.add('hidden');
    root.querySelector('#pin-input')?.focus();
  }

  async function submitPin() {
    const gate = root.querySelector('#pin-gate');
    const mode = gate.dataset.mode || 'hospital';
    const pin = root.querySelector('#pin-input').value.trim();
    const label = root.querySelector('#btn-pin-label');
    const btn = root.querySelector('#btn-pin-submit');
    const err = root.querySelector('#pin-error');
    err.classList.add('hidden');
    if (!pin) return;
    btn.disabled = true;
    label.innerHTML = `${icon('loader-2', 16, 'animate-spin')} Checking…`;

    try {
      if (mode === 'individual') {
        const staffId = gate.dataset.staffId;
        const staffName = gate.dataset.staffName;
        const staffRole = gate.dataset.staffRole || 'reception';
        const { data, error } = await sb.rpc('verify_individual_pin', {
          p_staff_id: staffId,
          p_pin: pin,
        });

        if (!error && data) {
          btn.disabled = false;
          label.textContent = 'Unlock';
          if (staffRole === 'doctor') enterAsDoctor(staffId);
          else enterAsReception(staffName, staffId);
          return;
        }

        // Doctor fallback: this doctor may not have an individual PIN set yet
        // (older doctors created before this feature) — try the hospital's
        // shared Doctor PIN as a backward-compatible fallback.
        if (staffRole === 'doctor') {
          const { data: sharedOk } = await sb.rpc('verify_staff_pin', {
            p_hospital_code: store.getState().hospitalCode,
            p_role: 'doctor',
            p_pin: pin,
          });
          btn.disabled = false;
          label.textContent = 'Unlock';
          if (sharedOk) {
            enterAsDoctor(staffId);
            return;
          }
          err.classList.remove('hidden');
          return;
        }

        btn.disabled = false;
        label.textContent = 'Unlock';
        err.classList.remove('hidden');
        return;
      }

      const role = gate.dataset.role;
      const { data, error } = await sb.rpc('verify_staff_pin', {
        p_hospital_code: store.getState().hospitalCode,
        p_role: role,
        p_pin: pin,
      });
      btn.disabled = false;
      label.textContent = 'Unlock';
      if (error || !data) {
        err.classList.remove('hidden');
        return;
      }
      localStorage.setItem(`shq_pin_ok_${role}_${store.getState().hospitalId}`, '1');
      enterStaffRole(role);
    } catch (e) {
      btn.disabled = false;
      label.textContent = 'Unlock';
      err.textContent = 'Connection error';
      err.classList.remove('hidden');
    }
  }

  root.querySelector('#btn-pin-submit')?.addEventListener('click', submitPin);
  root.querySelector('#pin-input')?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitPin();
  });

  // If a dedicated reception/doctor/manager link was opened and hospital already resolved, act now
  if (hasHospital && (PENDING_ROLE === 'reception' || PENDING_ROLE === 'doctor')) {
    enterStaffRole(PENDING_ROLE); // internally handles named-staff-select vs shared-PIN fallback
  } else if (hasHospital && PENDING_ROLE === 'manager') {
    if (isPinUnlocked('manager')) {
      enterStaffRole('manager');
    } else {
      showPinGate('manager');
    }
  }

  // Role selection
  root.querySelectorAll('[data-role]').forEach(btn => {
    btn.addEventListener('click', () => {
      const role = btn.dataset.role;
      if (role === 'patient') {
        root.querySelector('#role-select').classList.add('hidden');
        root.querySelector('#patient-login').classList.remove('hidden');
        root.querySelector('#phone-input')?.focus();
      } else if (role === 'reception' || role === 'doctor' || role === 'manager') {
        if (isPinUnlocked(role)) {
          enterStaffRole(role);
        } else {
          showPinGate(role);
        }
      }
    });
  });

  root.querySelectorAll('[data-action="back-roles"]').forEach(b => b.addEventListener('click', () => {
    root.querySelector('#patient-login')?.classList.add('hidden');
    root.querySelector('#pin-gate')?.classList.add('hidden');
    root.querySelector('#doctor-select-gate')?.classList.add('hidden');
    root.querySelector('#role-select')?.classList.remove('hidden');
  }));

  root.querySelector('#btn-patient-login')?.addEventListener('click', () => {
    const phone = root.querySelector('#phone-input').value;
    const err = root.querySelector('#login-error');
    const res = store.loginPatient(phone);
    if (!res.ok) {
      err.textContent = res.error;
      err.classList.remove('hidden');
      return;
    }
    err.classList.add('hidden');
    requestNotificationPermission();
    notifications.toast('Logged in', `+91 ${res.phone}`, 'success');
    window.location.hash = '#/patient';
  });

  // Enter key support
  root.querySelector('#phone-input')?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') root.querySelector('#btn-patient-login')?.click();
  });
}

            <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-card divide-y divide-slate-100 dark:divide-slate-800 overflow-hidden">
              ${history.map(h => `
                <div class="flex items-center gap-3 p-3.5">
                  <div class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center font-display font-bold text-sm token-display text-slate-600 dark:text-slate-300">
                    #${h.token}
                  </div>
                  <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium truncate">${formatDateTime(h.createdAt)}</p>
                    <p class="text-xs text-slate-500">${h.day}</p>
                  </div>
                  ${pStatusBadge(h.status)}
                </div>
              `).join('')}
            </div>
          `}
        </section>
      </main>
    `;

    refreshIcons();

    // Star rating interaction
    let selectedStars = 0;
    const starBtns = root.querySelectorAll('.star-btn');
    starBtns.forEach(b => {
      b.addEventListener('click', () => {
        selectedStars = Number(b.dataset.star);
        starBtns.forEach(sb => {
          sb.classList.toggle('text-amber-400', Number(sb.dataset.star) <= selectedStars);
          sb.classList.toggle('text-slate-300', Number(sb.dataset.star) > selectedStars);
          sb.classList.toggle('dark:text-slate-700', Number(sb.dataset.star) > selectedStars);
        });
        const submitBtn = root.querySelector('#btn-submit-feedback');
        if (submitBtn) submitBtn.disabled = false;
        submitBtn?.setAttribute('data-rating', String(selectedStars));
      });
    });

    // Countdown ticker
    if (patient_countdownTimer) clearInterval(patient_countdownTimer);
    if (eta && patient?.status === 'waiting' && eta.estimatedStart) {
      const tick = () => {
        const now = Date.now();
        const target = new Date(eta.estimatedStart).getTime();
        const diff = Math.max(0, Math.round((target - now) / 60000));
        const label = document.getElementById('countdown-label');
        if (label) label.textContent = diff <= 0 ? 'Any moment now' : `~${diff} min`;
      };
      tick();
      patient_countdownTimer = setInterval(tick, 30000);
    }
  };

  paint();
  patient_unsub = store.subscribe(paint);
  bus.on('queue:updated', paint);

  root.addEventListener('change', (e) => {
    if (e.target.id === 'lang-select') {
      setLang(e.target.value);
      paint();
    }
  });

  // Actions
  root.addEventListener('click', async (e) => {
    const openApptBtn = e.target.closest('[data-action="open-appointment"]');
    if (openApptBtn) {
      showAppointmentModal({ phone: session.phone, name: currentPatient?.name || '' });
      return;
    }
    const selectBtn = e.target.closest('[data-select-patient]');
    if (selectBtn) {
      selectedPatientId = selectBtn.dataset.selectPatient;
      paint();
      return;
    }
    const feedbackBtn = e.target.closest('#btn-submit-feedback');
    if (feedbackBtn) {
      const rating = Number(feedbackBtn.dataset.rating || 0);
      if (!rating) return;
      const patientId = feedbackBtn.dataset.patientId;
      const token = Number(feedbackBtn.dataset.token);
      const name = feedbackBtn.dataset.name;
      const comment = root.querySelector('#feedback-comment')?.value.trim() || null;
      feedbackBtn.disabled = true;
      feedbackBtn.textContent = 'Submitting…';
      try {
        await sb.from('feedback').insert({
          hospital_id: store.getState().hospitalId,
          patient_id: patientId,
          patient_name: name,
          token,
          rating,
          comment,
        });
        localStorage.setItem(`shq_feedback_${patientId}`, '1');
        notifications.toast('Thank you!', 'Your feedback was submitted', 'success');
        paint();
      } catch (err) {
        console.error(err);
        feedbackBtn.disabled = false;
        feedbackBtn.textContent = 'Submit Feedback';
        notifications.toast('Error', 'Could not submit feedback', 'error');
      }
      return;
    }
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    if (btn.dataset.action === 'logout') {
      store.logout('patient');
      window.location.hash = '#/';
    }
  });
}

function destroyPatient() {
  if (patient_unsub) patient_unsub();
  if (patient_countdownTimer) clearInterval(patient_countdownTimer);
  patient_unsub = null;
  patient_countdownTimer = null;
}

          <p>Scan to check your queue status live</p>
          <img src="${qrImgUrl}" width="300" height="300" />
          <p style="font-size:12px;color:#666;word-break:break-all;">${escapeHtml(patientUrl)}</p>
        </body></html>
      `);
      w.document.close();
      w.focus();
      setTimeout(() => w.print(), 300);
    }
  });
}

  reception_unsub = null;

let doctor_doctor_unsub = null;

const ADMIN_PASSCODE = 'myqueue2026'; // change this to your own secret

function generatePin() {
  return String(Math.floor(1000 + Math.random() * 9000));
}

function slugify(name) {
  const base = name.toLowerCase().trim()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
  const suffix = Math.random().toString(36).slice(2, 5);
  return (base || 'hospital') + '-' + suffix;
}

async function renderExplore(root) {
  root.innerHTML = `
    <div class="min-h-screen flex flex-col">
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-200 dark:border-slate-800 sticky top-0 bg-slate-50 dark:bg-slate-950 z-10">
        <div>
          <h1 class="font-display text-lg font-bold flex items-center gap-2">${icon('search', 18)} Find the Shortest Wait</h1>
          <p class="text-xs text-slate-500">Live doctor status across hospitals</p>
        </div>
        <a href="#/" class="text-xs underline text-slate-500 shrink-0">Back</a>
      </div>
      <div class="flex-1 px-4 py-5 max-w-md w-full mx-auto">
        <div id="explore-list" class="space-y-3">
          <div class="text-center py-10 text-slate-400 text-sm">
            ${icon('loader-2', 20, 'animate-spin mx-auto mb-2')}
            Loading live status…
          </div>
        </div>
      </div>
    </div>
  `;
  refreshIcons();

  const today = todayKey();
  try {
    const [{ data: hospitals }, { data: statuses }, { data: staffRows }, { data: patients }] = await Promise.all([
      sb.from('hospitals').select('id,name,code,address,phone'),
      sb.from('doctor_status').select('hospital_id,status,total_seen_today').eq('day', today),
      sb.from('staff').select('hospital_id,avg_consult_min').eq('role', 'doctor'),
      sb.from('patients').select('hospital_id,status').eq('day', today).in('status', ['waiting', 'consulting']),
    ]);

    const statusByHospital = {};
    (statuses || []).forEach(s => { statusByHospital[s.hospital_id] = s; });
    const avgByHospital = {};
    (staffRows || []).forEach(s => { avgByHospital[s.hospital_id] = s.avg_consult_min || DEFAULT_AVG_CONSULT; });
    const waitingByHospital = {};
    (patients || []).forEach(p => { waitingByHospital[p.hospital_id] = (waitingByHospital[p.hospital_id] || 0) + 1; });

    const rows = (hospitals || []).map(h => {
      const st = statusByHospital[h.id];
      const status = st?.status || 'unknown';
      const waiting = waitingByHospital[h.id] || 0;
      const avgMin = avgByHospital[h.id] || DEFAULT_AVG_CONSULT;
      const isOpen = !!st && status !== 'finished';
      const estWait = waiting * avgMin;
      return { ...h, status, waiting, estWait, isOpen };
    });

    // Sort: open hospitals first (by shortest estimated wait), closed/unknown last
    rows.sort((a, b) => {
      if (a.isOpen !== b.isOpen) return a.isOpen ? -1 : 1;
      return a.estWait - b.estWait;
    });

    const listEl = root.querySelector('#explore-list');
    if (!rows.length) {
      listEl.innerHTML = `<p class="text-center text-sm text-slate-400 py-10">No hospitals found yet.</p>`;
      return;
    }

    const STATUS_META = {
      available: { label: 'Available', cls: 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-200' },
      consulting: { label: 'In Consultation', cls: 'bg-teal-100 text-teal-800 dark:bg-teal-900/40 dark:text-teal-200' },
      paused: { label: 'Paused', cls: 'bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-200' },
      break: { label: 'On Break', cls: 'bg-orange-100 text-orange-800 dark:bg-orange-900/40 dark:text-orange-200' },
      emergency_pause: { label: 'Emergency', cls: 'bg-rose-100 text-rose-800 dark:bg-rose-900/40 dark:text-rose-200' },
      finished: { label: 'Closed for today', cls: 'bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400' },
      unknown: { label: 'Not started', cls: 'bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400' },
    };

    listEl.innerHTML = rows.map((h, idx) => {
      const meta = STATUS_META[h.status] || STATUS_META.unknown;
      const badge = idx === 0 && h.isOpen ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500 text-white">FASTEST</span>` : '';
      return `
        <button data-explore-code="${escapeHtml(h.code)}" class="w-full text-left rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-card p-4 hover:border-brand-400 transition ${!h.isOpen ? 'opacity-60' : ''}">
          <div class="flex items-start justify-between gap-2">
            <div>
              <p class="font-semibold text-sm flex items-center gap-2">${escapeHtml(h.name)} ${badge}</p>
              <p class="text-[11px] text-slate-500 mt-0.5">${escapeHtml(h.address || '')}</p>
            </div>
            <span class="text-[10px] font-semibold px-2 py-1 rounded-full whitespace-nowrap ${meta.cls}">${meta.label}</span>
          </div>
          ${h.isOpen ? `
            <div class="flex items-center gap-4 mt-3 text-xs text-slate-600 dark:text-slate-400">
              <span class="flex items-center gap-1">${icon('users', 13)} ${h.waiting} waiting</span>
              <span class="flex items-center gap-1">${icon('clock', 13)} ~${h.estWait} min wait</span>
            </div>
          ` : `<p class="text-[11px] text-slate-400 mt-2">Doctor hasn't started today, or day is over.</p>`}
        </button>
      `;
    }).join('');

    listEl.querySelectorAll('[data-explore-code]').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        const res = await store.initHospitalByCode(btn.dataset.exploreCode);
        if (res.ok) {
          PENDING_ROLE = 'patient';
          window.location.hash = '#/';
        } else {
          btn.disabled = false;
          notifications.toast('Error', 'Could not open this hospital', 'error');
        }
      });
    });
  } catch (e) {
    console.error(e);
    root.querySelector('#explore-list').innerHTML = `<p class="text-center text-sm text-rose-500 py-10">Could not load hospitals. Check your connection.</p>`;
  }
}
