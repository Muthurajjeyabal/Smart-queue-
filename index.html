        <a href="#/" class="text-xs underline text-slate-500">Back</a>
      </div>
      <div class="flex-1 px-5 py-6 max-w-md w-full mx-auto">
        ${authed ? `
          <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-card p-5 mb-6">
            <h2 class="font-display font-bold text-base mb-4">Add New Hospital</h2>
            <div class="space-y-3">
              <input id="ah-name" type="text" placeholder="Hospital name" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm outline-none focus:ring-2 focus:ring-brand-500" />
              <input id="ah-address" type="text" placeholder="Address" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm outline-none focus:ring-2 focus:ring-brand-500" />
              <input id="ah-phone" type="text" placeholder="Phone number" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm outline-none focus:ring-2 focus:ring-brand-500" />
              <button id="ah-submit" class="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm shadow-soft transition active:scale-[0.98]">Create Hospital</button>
              <p id="ah-error" class="text-xs text-rose-500 hidden"></p>
            </div>
            <div id="ah-result" class="hidden mt-4 p-4 rounded-xl bg-emerald-50 dark:bg-emerald-950 border border-emerald-200 dark:border-emerald-800">
              <p class="text-xs text-emerald-700 dark:text-emerald-300 font-semibold mb-1">Hospital created!</p>
              <p class="text-sm font-mono" id="ah-result-code"></p>
              <p class="text-sm font-mono font-bold mt-1" id="ah-result-pins"></p>
              <p class="text-[11px] text-rose-500 mt-1">⚠️ Save the PINs now — they won't be shown again.</p>
              <p class="text-[11px] text-slate-500 mt-2">Share this code with reception/doctor. Patient link:</p>
              <p class="text-[11px] font-mono break-all mt-1" id="ah-result-link"></p>
            </div>
          </div>
          <h2 class="font-display font-bold text-sm mb-3 text-slate-600 dark:text-slate-400">Existing Hospitals</h2>
          <div id="ah-list" class="space-y-2"></div>
        ` : `
          <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-card p-5">
            <h2 class="font-display font-bold text-base mb-3">Enter Admin Passcode</h2>
            <input id="ah-pass" type="password" placeholder="Passcode" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm outline-none focus:ring-2 focus:ring-brand-500 mb-3" />
            <button id="ah-unlock" class="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm shadow-soft transition active:scale-[0.98]">Unlock</button>
            <p id="ah-pass-error" class="text-xs text-rose-500 mt-3 hidden">Wrong passcode</p>
          </div>
        `}
      </div>
    </div>
  `;

  if (!authed) {
    root.querySelector('#ah-unlock')?.addEventListener('click', () => {
      const val = root.querySelector('#ah-pass').value;
      if (val === ADMIN_PASSCODE) {
        sessionStorage.setItem('shq_admin_ok', '1');
        renderAdmin(root);
      } else {
        root.querySelector('#ah-pass-error').classList.remove('hidden');
      }
    });
    root.querySelector('#ah-pass')?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') root.querySelector('#ah-unlock')?.click();
    });
    return;
  }

  async function loadList() {
    const listEl = root.querySelector('#ah-list');
    listEl.innerHTML = '<p class="text-xs text-slate-400">Loading…</p>';
    const { data, error } = await sb.from('hospitals').select('id,name,code,address,phone,created_at').order('created_at', { ascending: false });
    if (error || !data) {
      listEl.innerHTML = '<p class="text-xs text-rose-500">Could not load hospitals.</p>';
      return;
    }
    if (!data.length) {
      listEl.innerHTML = '<p class="text-xs text-slate-400">No hospitals yet.</p>';
      return;
    }
    listEl.innerHTML = data.map(h => `
      <div class="rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3">
        <p class="font-semibold text-sm">${escapeHtml(h.name)}</p>
        <p class="text-xs text-slate-500 font-mono mt-0.5">${escapeHtml(h.code)}</p>
        <p class="text-[11px] text-slate-400 mt-1">${escapeHtml(h.address || '')}</p>
      </div>
    `).join('');
  }

  loadList();

  root.querySelector('#ah-submit')?.addEventListener('click', async () => {
    const name = root.querySelector('#ah-name').value.trim();
    const address = root.querySelector('#ah-address').value.trim();
    const phone = root.querySelector('#ah-phone').value.trim();
    const errEl = root.querySelector('#ah-error');
    const btn = root.querySelector('#ah-submit');
    errEl.classList.add('hidden');

    if (!name) {
      errEl.textContent = 'Enter a hospital name';
      errEl.classList.remove('hidden');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Creating…';
    const code = slugify(name);
    const managerPin = generatePin();
    const { data, error } = await sb.from('hospitals')
      .insert({ name, code, address, phone, manager_pin: managerPin })
      .select('id,name,code,address,phone,created_at')
      .single();
    btn.disabled = false;
    btn.textContent = 'Create Hospital';

    if (error || !data) {
      errEl.textContent = 'Could not create hospital: ' + (error?.message || 'unknown error');
      errEl.classList.remove('hidden');
      return;
    }

    root.querySelector('#ah-name').value = '';
    root.querySelector('#ah-address').value = '';
    root.querySelector('#ah-phone').value = '';
    root.querySelector('#ah-result').classList.remove('hidden');
    root.querySelector('#ah-result-code').textContent = 'Code: ' + data.code;
    root.querySelector('#ah-result-pins').textContent = `Manager PIN: ${managerPin}`;
    root.querySelector('#ah-result-link').textContent = window.location.origin + window.location.pathname + '#/?h=' + data.code;
    loadList();
  });
}

function renderDoctor(root) {
  const session = store.getState().sessions.doctor;
  if (!session || !store.getState().hospitalId) {
    window.location.hash = '#/';
    return;
  }
  const doctorId = session.doctorId;

  const paint = () => {
    const state = store.getState();
    const doctor = store.getDoctor(doctorId);
    if (!doctor) {
      window.location.hash = '#/';
      return;
    }
    const snap = queueEngine.getSnapshot(doctorId);
    const current = store.getCurrentPatient(doctorId);
    const waiting = store.getWaitingPatients(doctorId);

    root.innerHTML = `
      ${headerBar({
        title: doctor.name,
        subtitle: doctor.specialty,
        rightHtml: `
          ${themeToggleBtn()}
          <button data-action="logout" class="p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition">
            ${icon('log-out', 18)}
          </button>
        `,
      })}

      <main class="flex-1 max-w-5xl mx-auto w-full px-4 sm:px-6 py-5 view-enter space-y-5">
        <!-- Status + Metrics -->
        <div class="flex flex-wrap items-center gap-3 justify-between">
          <div class="flex items-center gap-3">
            ${doctorStatusBadge(doctor.status)}
            <span class="text-sm text-slate-500">Avg consult · <strong class="text-slate-800 dark:text-slate-200">${doctor.avgConsultMin} min</strong></span>
          </div>
          <div class="flex gap-2 text-sm">
            <span class="px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-800 font-medium">${snap.totalSeen} seen today</span>
            <span class="px-3 py-1 rounded-full bg-brand-50 dark:bg-brand-950 text-brand-700 dark:text-brand-300 font-medium">${snap.totalWaiting} waiting</span>
          </div>
        </div>

        <div class="grid sm:grid-cols-3 gap-3">
          ${metricCard('Current Token', current ? '#' + current.token : '—', current ? current.name : 'No active consultation', 'teal')}
          ${metricCard('Next Up', waiting[0] ? '#' + waiting[0].token : '—', waiting[0] ? waiting[0].name : 'Queue empty', 'amber')}
          ${metricCard('In Queue', snap.totalInQueue, snap.totalWaiting + ' waiting', 'slate')}
        </div>

        <!-- Primary Controls -->
        <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-card p-5">
          <h2 class="font-display font-bold text-sm uppercase tracking-wider text-slate-500 mb-4">Consultation Controls</h2>
          <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2.5">
            <button data-action="start" class="flex flex-col items-center gap-2 p-4 rounded-xl bg-teal-600 hover:bg-teal-700 text-white transition active:scale-95 disabled:opacity-40 disabled:pointer-events-none" ${doctor.status === 'finished' || doctor.status === 'consulting' ? 'disabled' : ''}>
              ${icon('play', 22)}
              <span class="text-xs font-semibold">Start</span>
            </button>
            <button data-action="next" class="flex flex-col items-center gap-2 p-4 rounded-xl bg-brand-600 hover:bg-brand-700 text-white transition active:scale-95 disabled:opacity-40 disabled:pointer-events-none" ${doctor.status === 'finished' ? 'disabled' : ''}>
              ${icon('skip-forward', 22)}
              <span class="text-xs font-semibold">Next Patient</span>
            </button>
            <button data-action="pause" class="flex flex-col items-center gap-2 p-4 rounded-xl bg-amber-500 hover:bg-amber-600 text-white transition active:scale-95 disabled:opacity-40 disabled:pointer-events-none" ${['paused','break','emergency_pause','finished'].includes(doctor.status) ? 'disabled' : ''}>
              ${icon('pause', 22)}
              <span class="text-xs font-semibold">Pause</span>
            </button>
            <button data-action="break" class="flex flex-col items-center gap-2 p-4 rounded-xl bg-orange-500 hover:bg-orange-600 text-white transition active:scale-95 disabled:opacity-40 disabled:pointer-events-none" ${['break','finished'].includes(doctor.status) ? 'disabled' : ''}>
              ${icon('coffee', 22)}
              <span class="text-xs font-semibold">Lunch Break</span>
            </button>
            <button data-action="emergency" class="flex flex-col items-center gap-2 p-4 rounded-xl bg-rose-600 hover:bg-rose-700 text-white transition active:scale-95 disabled:opacity-40 disabled:pointer-events-none" ${doctor.status === 'finished' ? 'disabled' : ''}>
              ${icon('alert-triangle', 22)}
              <span class="text-xs font-semibold">Emergency</span>
            </button>
            <button data-action="resume" class="flex flex-col items-center gap-2 p-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white transition active:scale-95 disabled:opacity-40 disabled:pointer-events-none" ${!['paused','break','emergency_pause'].includes(doctor.status) ? 'disabled' : ''}>
              ${icon('play-circle', 22)}
              <span class="text-xs font-semibold">Resume</span>
            </button>
          </div>
          <div class="mt-4 pt-4 border-t border-slate-100 dark:border-slate-800 flex justify-end">
            <button data-action="finish" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/40 transition disabled:opacity-40" ${doctor.status === 'finished' ? 'disabled' : ''}>
              ${icon('power', 16)} Finish Day
            </button>
          </div>
        </div>

        <!-- Current patient detail -->
        ${current ? `
          <div class="rounded-2xl border-2 border-teal-500/30 bg-teal-50/50 dark:bg-teal-950/20 p-5">
            <div class="flex items-start justify-between gap-4">
              <div>
                <p class="text-xs font-medium uppercase tracking-wider text-teal-700 dark:text-teal-300 mb-1">Now Consulting</p>
                <p class="font-display text-2xl font-bold">#${current.token} · ${current.name}</p>
                <p class="text-sm text-slate-500 mt-1">${current.phone} · Started ${formatTime(current.consultStartedAt)}</p>
              </div>
              <button data-status="completed" data-id="${current.id}" class="shrink-0 px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold transition">
                Complete
              </button>
            </div>
          </div>
        ` : ''}

        <!-- Waiting list -->
        <div class="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-card overflow-hidden">
          <div class="p-4 border-b border-slate-100 dark:border-slate-800">
            <h2 class="font-display font-bold text-base">Waiting Queue</h2>
          </div>
          <div class="divide-y divide-slate-100 dark:divide-slate-800 max-h-80 overflow-y-auto">
            ${waiting.length === 0 ? `
              <div class="p-10 text-center text-sm text-slate-400">No patients waiting</div>
            ` : waiting.map((p, i) => `
              <div class="flex items-center gap-3 p-3.5">
                <span class="w-7 h-7 rounded-lg bg-slate-100 dark:bg-slate-800 text-xs font-bold flex items-center justify-center text-slate-500">${i + 1}</span>
                <div class="w-10 h-10 rounded-xl ${p.isEmergency ? 'bg-rose-100 dark:bg-rose-900/40 text-rose-700' : 'bg-brand-100 dark:bg-brand-900/40 text-brand-700'} flex items-center justify-center font-display font-bold text-sm token-display">
                  ${p.token}
                </div>
                <div class="flex-1 min-w-0">
                  <p class="font-semibold text-sm truncate">${p.name} ${p.isEmergency ? '<span class="text-rose-600 text-[10px] uppercase font-bold ml-1">Emergency</span>' : ''}</p>
                  <p class="text-xs text-slate-500">${p.phone}</p>
                </div>
                ${statusBadge(p.status)}
              </div>
            `).join('')}
          </div>
        </div>
      </main>
    `;

    refreshIcons();
  };

  paint();
  doctor_unsub = store.subscribe(paint);
  bus.on('queue:updated', paint);

  root.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action], [data-status]');
    if (!btn) return;

    if (btn.dataset.action === 'logout') {
      store.logout('doctor');
      window.location.hash = '#/';
      return;
    }
    if (btn.dataset.action === 'start') {
      const res = store.doctorStartConsultation(doctorId);
      if (!res.ok) notifications.toast('Cannot start', res.error, 'warning');
      else notifications.toast('Consultation started', '#' + res.patient.token + ' · ' + res.patient.name, 'success');
    }
    if (btn.dataset.action === 'next') {
      const res = store.doctorNextPatient(doctorId);
      if (!res.ok) notifications.toast('Queue empty', res.error, 'warning');
      else notifications.toast('Next patient', '#' + res.patient.token + ' · ' + res.patient.name, 'success');
    }
    if (btn.dataset.action === 'pause') {
      store.doctorPause(doctorId, 'paused');
      notifications.toast('Queue paused', 'Patients will see a delay notice', 'warning');
    }
    if (btn.dataset.action === 'break') {
      store.doctorPause(doctorId, 'break');
      notifications.toast('Lunch break', 'Queue paused for break', 'warning');
    }
    if (btn.dataset.action === 'emergency') {
      store.doctorPause(doctorId, 'emergency');
      notifications.toast('Emergency pause', 'Queue temporarily halted', 'error');
    }
    if (btn.dataset.action === 'resume') {
      store.doctorResume(doctorId);
      notifications.toast('Queue resumed', 'Doctor is available again', 'success');
    }
    if (btn.dataset.action === 'finish') {
      if (confirm('Finish the day? Remaining waiting patients will be marked cancelled.')) {
        store.doctorFinishDay(doctorId);
        notifications.toast('Day finished', 'Thank you, Doctor', 'info');
      }
    }
    if (btn.dataset.status === 'completed' && btn.dataset.id) {
      store.setPatientStatus(btn.dataset.id, 'completed');
      notifications.toast('Consultation completed', 'Ready for next patient', 'success');
    }
  });
}

function destroyDoctor() {
  if (doctor_unsub) doctor_unsub();
  doctor_unsub = null;
}


/**
 * Smart Hospital Queue — Application Bootstrap & Router
 * Version 1.0 — Time Management & Smart Queue System
 *
 * Architecture is modular so future modules (AI ETA, multi-doctor,
 * multi-hospital, EMR, billing, etc.) can plug in without redesign.
 */









const app = document.getElementById('app');
const splash = document.getElementById('splash');

// ---------- Theme ----------
function initTheme() {
  const saved = localStorage.getItem('shq_theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = saved || (prefersDark ? 'dark' : 'light');
  document.documentElement.classList.toggle('dark', theme === 'dark');
}

function toggleTheme() {
  const isDark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('shq_theme', isDark ? 'dark' : 'light');
}

// ---------- Router ----------
let currentDestroy = null;

function route() {
  if (currentDestroy) {
    currentDestroy();
    currentDestroy = null;
  }

  const hash = window.location.hash || '#/';
  const path = hash.replace(/^#/, '') || '/';

  // Clear app
  app.innerHTML = '';
  const root = document.createElement('div');
  root.className = 'min-h-screen flex flex-col';
  app.appendChild(root);

  if (path === '/' || path === '') {
    renderLogin(root);
  } else if (path.startsWith('/patient')) {
    renderPatient(root);
    currentDestroy = destroyPatient;
  } else if (path.startsWith('/reception')) {
    renderReception(root);
    currentDestroy = destroyReception;
  } else if (path.startsWith('/doctor')) {
    renderDoctor(root);
    currentDestroy = destroyDoctor;
  } else if (path.startsWith('/manager')) {
    renderManager(root);
    currentDestroy = destroyManager;
  } else if (path.startsWith('/admin')) {
    renderAdmin(root);
  } else if (path.startsWith('/explore') && EXPLORE_FEATURE_ENABLED) {
    renderExplore(root);
  } else {
    window.location.hash = '#/';
  }

  refreshIcons();
}

// Global action delegation for theme
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action="toggle-theme"]');
  if (btn) toggleTheme();
});

// ---------- Boot ----------
function hideSplash() {
  var splash = document.getElementById('splash');
  if (splash) {
    splash.style.opacity = '0';
    splash.style.pointerEvents = 'none';
    setTimeout(function(){ if (splash && splash.parentNode) splash.remove(); }, 400);
  }
}

let PENDING_ROLE = null;

function isPinUnlocked(role) {
  return localStorage.getItem(`shq_pin_ok_${role}_${store.getState().hospitalId}`) === '1';
}

function autoEnterRole() {
  if (!store.getState().hospitalId) return false;
  if (PENDING_ROLE === 'reception' && isPinUnlocked('reception')) {
    const staff = store.getState().receptionStaff.filter(s => s.active !== false);
    if (staff.length === 0) {
      store.loginReception();
      window.location.hash = '#/reception';
      return true;
    }
    return false; // named staff exist — let renderLogin show the name-select screen
  }
  if (PENDING_ROLE === 'doctor') {
    return false; // doctors always identify themselves + enter their own PIN
  }
  if (PENDING_ROLE === 'manager' && isPinUnlocked('manager')) {
    store.loginManager();
    window.location.hash = '#/manager';
    return true;
  }
  return false;
}

async function boot() {
  try {
    var bar = document.getElementById('splash-bar');
    if (bar) bar.style.width = '60%';
    initTheme();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        reg.update().catch(() => {});
      }).catch(() => {});
    }

    // Resolve hospital: URL param (?h=CODE for patient QR links) takes priority, else remembered device hospital
    const hash = window.location.hash || '#/';
    const qIdx = hash.indexOf('?');
    const params = new URLSearchParams(qIdx >= 0 ? hash.slice(qIdx + 1) : '');
    const urlCode = params.get('h');
    PENDING_ROLE = params.get('role'); // 'reception' | 'doctor' | 'patient' | null — from dedicated shortcut links

    if (urlCode) {
      await store.initHospitalByCode(urlCode);
    } else {
      const savedId = localStorage.getItem('shq_hospital_id');
      if (savedId) await store.initHospitalById(savedId);
    }

    if (bar) bar.style.width = '90%';
    queueEngine.start();
    notifications.start();
    if (bar) bar.style.width = '100%';
    window.addEventListener('hashchange', route);
    if (!autoEnterRole()) route();
    setTimeout(hideSplash, 350);
  } catch (err) {
    console.error(err);
    var errEl = document.getElementById('splash-err');
    if (errEl) {
      errEl.textContent = 'Error: ' + (err.message || String(err));
      errEl.style.display = 'block';
    }
    setTimeout(hideSplash, 1500);
  }
}

setTimeout(hideSplash, 2000);
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function(){ setTimeout(boot, 50); });
} else {
  setTimeout(boot, 50);
}

  </script>
